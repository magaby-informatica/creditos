<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:"Source Sans 3",sans-serif;display:flex;justify-content:center;padding:10px;}
.recibo{background:#fff;width:520px;border:2px solid #1a3a6e;border-radius:6px;padding:18px 20px 20px;position:relative;border-right:32px solid #1a3a6e;}
.texto-vertical{position:absolute;right:-26px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;color:#fff;font-size:8px;text-align:center;letter-spacing:0.5px;font-weight:bold;}
.header-banner{width:100%;border:1.5px solid #1a3a6e;border-radius:4px;overflow:hidden;margin-bottom:12px;background:#fff;text-align:center;}
.header-banner img{width:100%;max-height:90px;object-fit:contain;display:block;}
.fila-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.campo-label{font-size:13px;color:#1a3a6e;font-weight:600;}
.numero-recibo{font-family:"Oswald",sans-serif;font-size:22px;font-weight:700;color:#1a3a6e;}
.fila-cuenta{display:flex;gap:10px;margin-bottom:12px;align-items:center;}
.box-campo{border:1.5px solid #1a3a6e;border-radius:4px;padding:5px 12px;display:flex;flex:1;justify-content:space-between;align-items:center;}
.box-cuota{border:2px solid #1a3a6e;border-radius:4px;padding:5px 16px;background:#f4f7fa;text-align:center;}
.seccion-doble{display:flex;gap:10px;margin-bottom:8px;}
.datos-cliente{flex:1;border:1.5px solid #1a3a6e;border-radius:4px;padding:10px;}
.datos-cliente h3{text-align:center;font-size:15px;color:#1a3a6e;border-bottom:1px solid #1a3a6e;margin-bottom:8px;padding-bottom:4px;text-transform:uppercase;}
.linea{font-size:13px;color:#333;margin-bottom:3px;}
.extracto{width:170px;border:1.5px solid #1a3a6e;border-radius:4px;overflow:hidden;}
.extracto h3{text-align:center;font-size:11px;color:#fff;background:#1a3a6e;padding:5px;text-transform:uppercase;}
.extracto table{width:100%;border-collapse:collapse;}
.extracto td{padding:6px;font-size:13px;border-bottom:1px solid #eee;}
.extracto td:first-child{font-weight:bold;color:#1a3a6e;border-right:1px solid #eee;}
.footer{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:#1a3a6e;font-weight:bold;}
</style>
</head>
<body>
<div class="recibo">
  <div class="texto-vertical">La empresa no responde por negocios a el cobrador</div>

  <div class="header-banner">
    <img src="https://i.imgur.com/your-logo.png" alt="MINCHO"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
    <div style="display:none;padding:18px 0;font-size:22px;font-weight:bold;color:#1a3a6e;">
      MINCHO
    </div>
  </div>

  <div class="fila-meta">
    <div>
      <span class="campo-label">FECHA: </span>
      <span id="fecha"></span>
    </div>
    <div class="numero-recibo">RUTA <span id="rutai"></span></div>
  </div>

  <div class="fila-cuenta">
    <div class="box-campo">
      <span style="font-weight:bold;color:#1a3a6e;font-size:11px;">CUENTA No.</span>
      <span id="credito"></span>
    </div>
    <div class="box-cuota">
      <div style="font-size:10px;font-weight:bold;color:#1a3a6e;">CUOTA</div>
      <div style="font-size:18px;font-weight:bold;" id="vcuota"></div>
    </div>
  </div>

  <div class="seccion-doble">
    <div class="datos-cliente">
      <h3>Datos del Cliente</h3>
      <div class="linea"><strong>Nombre:</strong> <span id="nombre"></span></div>
      <div class="linea"><strong>Valor Préstamo:</strong> <span id="montoi"></span></div>
      <div class="linea"><strong>Días:</strong> <span id="dias_in"></span></div>
      <div class="linea"><strong>Saldo Anterior:</strong> <span id="saldoi"></span></div>
      <div class="linea"><strong>Saldo Actual:</strong> <span id="nuevosaldo"></span></div>
    </div>

    <div class="extracto">
      <h3>Extracto de Manejo</h3>
      <table>
        <tr><td>CUOTA No</td><td id="cuotanumero"></td></tr>
        <tr><td>PAGADAS</td><td id="cp"></td></tr>
        <tr style="color:#cc0000;"><td>ATRASOS</td><td id="at"></td></tr>
        <tr><td>PENDIENTES</td><td id="sc"></td></tr>
      </table>
    </div>
  </div>

  <div class="footer">
    <span>&#128241; WhatsApp: +57 300 000 0000</span>
  </div>
</div>

<script>
function dinero(v){
  return v ? "$"+new Intl.NumberFormat('es-CO').format(v) : "";
}
const p = new URLSearchParams(window.location.search);
document.getElementById("fecha").innerText       = p.get("fecha")        || "";
document.getElementById("rutai").innerText       = p.get("rutai")        || "";
document.getElementById("credito").innerText     = p.get("credito")      || "";
document.getElementById("vcuota").innerText      = dinero(p.get("vcuota"));
document.getElementById("nombre").innerText      = p.get("nombre")       || "";
document.getElementById("montoi").innerText      = dinero(p.get("Montoi"));
document.getElementById("dias_in").innerText     = p.get("dias_in")      || "";
document.getElementById("saldoi").innerText      = dinero(p.get("saldoi"));
document.getElementById("nuevosaldo").innerText  = dinero(p.get("NuevoSaldo"));
document.getElementById("cuotanumero").innerText = p.get("CuotaNumero")  || "";
document.getElementById("cp").innerText          = p.get("cp")           || "";
document.getElementById("at").innerText          = p.get("at")           || "";
document.getElementById("sc").innerText          = p.get("sc")           || "";
</script>
</body>
</html>
